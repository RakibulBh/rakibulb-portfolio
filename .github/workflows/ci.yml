name: CI

on:
  # Reusable: called by other workflows (e.g. deploy).
  workflow_call:
  # Standalone: validate every pull request.
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test:run

      - name: Build
        env:
          # A real token is only needed in the browser at runtime; a placeholder
          # is enough to satisfy the production build here.
          NEXT_PUBLIC_GITHUB_TOKEN: ci_placeholder_token
        run: bun run build
