name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Reuse the standalone CI workflow instead of duplicating steps here.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to home server
    # GitHub-hosted runner. It reaches the (public-IP-less) home server over
    # Tailscale and drives the deploy via SSH; the build/containers run there.
    runs-on: ubuntu-latest
    needs: [ci]
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          # Prefer OAuth for a non-expiring setup:
          #   oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          #   oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          #   tags: tag:ci

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host home
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF

      - name: Write .env.prod
        env:
          NEXT_PUBLIC_GITHUB_TOKEN: ${{ secrets.NEXT_PUBLIC_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Optional — only powers the GitHub contributions widget; build works without it.
          if [ -z "${NEXT_PUBLIC_GITHUB_TOKEN:-}" ]; then
            echo "::warning::NEXT_PUBLIC_GITHUB_TOKEN not set — contributions widget will be disabled."
          fi
          {
            echo "NEXT_PUBLIC_GITHUB_TOKEN=${NEXT_PUBLIC_GITHUB_TOKEN:-}"
            echo "APP_VERSION=${GITHUB_SHA}"
          } > .env.prod
          chmod 600 .env.prod

      - name: Sync code to server
        run: |
          set -euo pipefail
          # Mirror the checkout (incl. the generated .env.prod) to the server.
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            ./ home:apps/portfolio/

      - name: Deploy over SSH
        run: |
          set -euo pipefail
          ssh home 'bash -euo pipefail -s' <<'REMOTE'
          cd ~/apps/portfolio
          COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.prod"

          echo "==> Ensuring external 'proxy-network' exists..."
          docker network inspect proxy-network >/dev/null 2>&1 || docker network create proxy-network

          echo "==> Building and starting web service..."
          $COMPOSE up -d --build --remove-orphans

          echo "==> Waiting for portfolio-web health (max 120s)..."
          for i in $(seq 1 24); do
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' portfolio-web 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then echo "portfolio-web is healthy!"; break; fi
            if [ "$i" -eq 24 ]; then echo "portfolio-web failed to become healthy (last status: $status)"; $COMPOSE logs web --tail=120; exit 1; fi
            echo "Waiting... ($i/24, status=$status)"; sleep 5
          done

          echo "==> Cleaning up old images..."
          docker image prune -f

          echo "==> Deployment status:"
          $COMPOSE ps
          REMOTE

      - name: Show logs on failure
        if: failure()
        run: |
          ssh home 'cd ~/apps/portfolio && docker compose -f docker-compose.prod.yml --env-file .env.prod logs web --tail=150' || true
